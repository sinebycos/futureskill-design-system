<!-- @dsCard group="Spacing" viewport="700x140" name="Interaction states" subtitle="Hover overlays fill-hover, press fill-click, focus 2px stroke-focus ring with 2px gap" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:16px"><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);">Default</div><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);background:var(--fill-hover)">Hover</div><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);background:var(--fill-click)">Press</div><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);outline:2px solid var(--stroke-focus);outline-offset:2px">Focus</div><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);background:var(--fill-brand-weak);color:var(--text-brand);font-weight:600">Selected</div><div style="padding:8px 16px;border-radius:8px;font-family:var(--font-thai);color:var(--text-disabled)">Disabled</div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
