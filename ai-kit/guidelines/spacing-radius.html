<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="radius-2 … radius-full" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:16px"><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-2)"></div><div class="l">radius-2</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-4)"></div><div class="l">radius-4</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-6)"></div><div class="l">radius-6</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-8)"></div><div class="l">radius-8</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-12)"></div><div class="l">radius-12</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-16)"></div><div class="l">radius-16</div></div><div style="text-align:center"><div style="width:72px;height:72px;background:var(--fill-brand-weak);border:1px solid var(--stroke-brand-weak);border-radius:var(--radius-full)"></div><div class="l">radius-full</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
