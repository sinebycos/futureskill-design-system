<!-- @dsCard group="Colors" viewport="700x150" name="Brand purple" subtitle="brand-light ramp — 500 is fill-brand-strong (light), 300 in dark" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div class="grid" style="grid-template-columns:repeat(10,1fr)"><div class="sw"><div class="c" style="background:var(--brand-light-50)"></div><div class="n">50</div><div class="v" data-v="--brand-light-50"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-100)"></div><div class="n">100</div><div class="v" data-v="--brand-light-100"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-200)"></div><div class="n">200</div><div class="v" data-v="--brand-light-200"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-300)"></div><div class="n">300</div><div class="v" data-v="--brand-light-300"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-400)"></div><div class="n">400</div><div class="v" data-v="--brand-light-400"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-500)"></div><div class="n">500</div><div class="v" data-v="--brand-light-500"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-600)"></div><div class="n">600</div><div class="v" data-v="--brand-light-600"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-700)"></div><div class="n">700</div><div class="v" data-v="--brand-light-700"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-800)"></div><div class="n">800</div><div class="v" data-v="--brand-light-800"></div></div><div class="sw"><div class="c" style="background:var(--brand-light-900)"></div><div class="n">900</div><div class="v" data-v="--brand-light-900"></div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
