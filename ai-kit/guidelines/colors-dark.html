<!-- @dsCard group="Colors" viewport="700x190" name="Dark theme" subtitle="Same semantic tokens under data-theme="dark" — brand lightens to brand-light-300" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body data-theme="dark" style="background:var(--background-base)"><div data-theme="dark" style="background:var(--background-base);padding:4px"><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="c" style="background:var(--background-base)"></div><div class="n" style="color:var(--text-weak)">background-base</div></div><div class="sw"><div class="c" style="background:var(--background-raised)"></div><div class="n" style="color:var(--text-weak)">background-raised</div></div><div class="sw"><div class="c" style="background:var(--fill-brand-strong)"></div><div class="n" style="color:var(--text-weak)">fill-brand-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-brand-weak)"></div><div class="n" style="color:var(--text-weak)">fill-brand-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-secondary-brand-strong)"></div><div class="n" style="color:var(--text-weak)">fill-secondary-brand-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-weak)"></div><div class="n" style="color:var(--text-weak)">fill-weak</div></div><div class="sw"><div class="c" style="background:var(--text-strong)"></div><div class="n" style="color:var(--text-weak)">text-strong</div></div><div class="sw"><div class="c" style="background:var(--text-weak)"></div><div class="n" style="color:var(--text-weak)">text-weak</div></div></div><div style="margin-top:12px;font-family:var(--font-thai);color:var(--text-strong)">ข้อความหลัก <span style="color:var(--text-brand)">ลิงก์แบรนด์</span> <span style="color:var(--text-weak)">ข้อความรอง</span></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
