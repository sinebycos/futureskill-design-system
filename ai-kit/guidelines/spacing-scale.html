<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="space-* tokens named by value" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-2</span><span style="height:10px;width:var(--space-2);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-4</span><span style="height:10px;width:var(--space-4);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-8</span><span style="height:10px;width:var(--space-8);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-10</span><span style="height:10px;width:var(--space-10);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-12</span><span style="height:10px;width:var(--space-12);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-16</span><span style="height:10px;width:var(--space-16);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-24</span><span style="height:10px;width:var(--space-24);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-32</span><span style="height:10px;width:var(--space-32);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-40</span><span style="height:10px;width:var(--space-40);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-48</span><span style="height:10px;width:var(--space-48);background:var(--fill-brand-strong);border-radius:2px"></span></div><div style="display:flex;height:14px;align-items:center;gap:12px;margin-bottom:3px"><span class="l" style="width:80px">space-80</span><span style="height:10px;width:var(--space-80);background:var(--fill-brand-strong);border-radius:2px"></span></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
