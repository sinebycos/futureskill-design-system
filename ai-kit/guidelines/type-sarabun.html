<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;align-items:baseline;gap:16px;margin-bottom:6px"><span class="l" style="width:120px;flex:none">th-caption-1<br>16/22 600</span><span class="th-caption-1" style="white-space:nowrap;overflow:hidden">คำอธิบายภาพ Caption</span></div><div style="display:flex;align-items:baseline;gap:16px;margin-bottom:6px"><span class="l" style="width:120px;flex:none">th-caption-2<br>18/26 600</span><span class="th-caption-2" style="white-space:nowrap;overflow:hidden">คำอธิบายภาพ Caption</span></div><div style="display:flex;align-items:baseline;gap:16px;margin-bottom:6px"><span class="l" style="width:120px;flex:none">th-button<br>16 600</span><span class="th-button" style="white-space:nowrap;overflow:hidden">ปุ่มกด Button</span></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
