<!-- @dsCard group="Brand" viewport="700x180" name="Logos" subtitle="fs-logo-light.png on light, fs-logo-dark.png on dark — never redraw or recolour" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="height:140px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--stroke-weak);border-radius:8px"><img src="../assets/logos/fs-logo-light.png" style="height:44px"></div><div style="height:140px;display:flex;align-items:center;justify-content:center;background:#0a0f18;border-radius:8px"><img src="../assets/logos/fs-logo-dark.png" style="height:44px"></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
