<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Flat by default; shadows only on things that float or press" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:20px;padding:8px;background:var(--background-sunken);border-radius:8px"><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-button)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-button</div></div><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-raised)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-raised</div></div><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-card-course)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-card-course</div></div><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-overlay)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-overlay</div></div><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-picker-popover)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-picker-popover</div></div><div><div style="width:90px;height:80px;background:var(--background-raised);border-radius:8px;box-shadow:var(--shadow-sunken)"></div><div class="l" style="font-size:10px;margin-top:6px">shadow-sunken</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
