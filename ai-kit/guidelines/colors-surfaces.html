<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces" subtitle="background-* layers: page, card, overlay, well, inverse" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div><div style="height:80px;border-radius:8px;background:var(--background-base);border:1px solid var(--stroke-weak);"></div><div class="l" style="margin-top:6px">background-base</div></div><div><div style="height:80px;border-radius:8px;background:var(--background-raised);border:1px solid var(--stroke-weak);box-shadow:var(--shadow-raised)"></div><div class="l" style="margin-top:6px">background-raised</div></div><div><div style="height:80px;border-radius:8px;background:var(--background-overlay);border:1px solid var(--stroke-weak);box-shadow:var(--shadow-overlay)"></div><div class="l" style="margin-top:6px">background-overlay</div></div><div><div style="height:80px;border-radius:8px;background:var(--background-sunken);border:1px solid var(--stroke-weak);box-shadow:var(--shadow-sunken)"></div><div class="l" style="margin-top:6px">background-sunken</div></div><div><div style="height:80px;border-radius:8px;background:var(--background-inverse);border:1px solid var(--stroke-weak);"></div><div class="l" style="margin-top:6px">background-inverse</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
