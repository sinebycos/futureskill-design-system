<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div class="grid" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><div class="c" style="background:var(--fill-open-ended)"></div><div class="n">fill-open-ended</div></div><div class="sw"><div class="c" style="background:var(--fill-choice)"></div><div class="n">fill-choice</div></div><div class="sw"><div class="c" style="background:var(--fill-apprenticeship)"></div><div class="n">fill-apprenticeship</div></div><div class="sw"><div class="c" style="background:var(--fill-orientation)"></div><div class="n">fill-orientation</div></div><div class="sw"><div class="c" style="background:var(--fill-simulated-training)"></div><div class="n">fill-simulated-training</div></div><div class="sw"><div class="c" style="background:var(--fill-cross-training)"></div><div class="n">fill-cross-training</div></div><div class="sw"><div class="c" style="background:var(--text-open-ended)"></div><div class="n">text-open-ended</div></div><div class="sw"><div class="c" style="background:var(--text-choice)"></div><div class="n">text-choice</div></div><div class="sw"><div class="c" style="background:var(--text-apprenticeship)"></div><div class="n">text-apprenticeship</div></div><div class="sw"><div class="c" style="background:var(--text-orientation)"></div><div class="n">text-orientation</div></div><div class="sw"><div class="c" style="background:var(--text-simulated-training)"></div><div class="n">text-simulated-training</div></div><div class="sw"><div class="c" style="background:var(--text-cross-training)"></div><div class="n">text-cross-training</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
