<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:16px;align-items:center"><img src="../assets/logos/favicon.png" style="width:112px;height:112px;border-radius:16px;border:1px solid var(--stroke-weak)"><img src="../assets/logos/favicon.png" style="width:48px;height:48px"><img src="../assets/logos/favicon.png" style="width:24px;height:24px"></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
