<!-- @dsCard group="Colors" viewport="700x150" name="Semantic · text & icon" subtitle="What you build with: text-* and icon-* tokens" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-strong)">ข้อความ Aa<div class="l">text-strong</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-weak)">ข้อความ Aa<div class="l">text-weak</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-brand)">ข้อความ Aa<div class="l">text-brand</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-secondary-brand)">ข้อความ Aa<div class="l">text-secondary-brand</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-error)">ข้อความ Aa<div class="l">text-error</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-warning)">ข้อความ Aa<div class="l">text-warning</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-success)">ข้อความ Aa<div class="l">text-success</div></div><div style="font-family:var(--font-thai);font-size:16px;line-height:24px;color:var(--text-disabled)">ข้อความ Aa<div class="l">text-disabled</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
