<!-- @dsCard group="Colors" viewport="700x240" name="Semantic · fill & stroke" subtitle="fill-* grounds and stroke-* lines; status in strong + weak steps" -->
<!doctype html><html lang="th"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);color:var(--text-strong)}
.sw{display:grid;gap:6px}.sw .c{height:44px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--stroke-weak)}.sw .n{font-size:11px;line-height:14px;color:var(--text-weak);font-family:var(--font-thai)}.sw .v{font-size:10px;line-height:12px;color:var(--text-weak);font-family:ui-monospace,monospace}
.grid{display:grid;gap:10px}.l{font-size:12px;line-height:18px;color:var(--text-weak);font-family:ui-monospace,monospace}</style></head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="c" style="background:var(--fill-brand-strong)"></div><div class="n">fill-brand-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-brand-weak)"></div><div class="n">fill-brand-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-secondary-brand-strong)"></div><div class="n">fill-secondary-brand-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-secondary-brand-weak)"></div><div class="n">fill-secondary-brand-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-strong)"></div><div class="n">fill-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-weak)"></div><div class="n">fill-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-weaker)"></div><div class="n">fill-weaker</div></div><div class="sw"><div class="c" style="background:var(--fill-disabled)"></div><div class="n">fill-disabled</div></div><div class="sw"><div class="c" style="background:var(--fill-error-strong)"></div><div class="n">fill-error-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-error-weak)"></div><div class="n">fill-error-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-warning-strong)"></div><div class="n">fill-warning-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-warning-weak)"></div><div class="n">fill-warning-weak</div></div><div class="sw"><div class="c" style="background:var(--fill-success-strong)"></div><div class="n">fill-success-strong</div></div><div class="sw"><div class="c" style="background:var(--fill-success-weak)"></div><div class="n">fill-success-weak</div></div><div class="sw"><div class="c" style="background:var(--stroke-brand-weak)"></div><div class="n">stroke-brand-weak</div></div><div class="sw"><div class="c" style="background:var(--stroke-weak)"></div><div class="n">stroke-weak</div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim()})</script></body></html>
